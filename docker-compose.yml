version: '3.8'

services:
  traffic-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_ai_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=50
      - CUDA_VISIBLE_DEVICES=0  # Set to -1 if running exclusively on CPU
      - DB_PATH=/app/database/traffic_records.db
    volumes:
      # Persistent bind mounts for evidence storage and SQLite DB
      - ./data/evidence:/app/storage/evidence
      - ./data/plates:/app/storage/plates
      - ./data/db:/app/database
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            # Enable NVIDIA GPU access if host has nvidia-container-toolkit installed
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Optional Nginx Reverse Proxy for SSL termination and Officer Auth
  reverse-proxy:
    image: nginx:alpine
    container_name: traffic_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - traffic-monitor
